# Shared proxy settings. Each location declares its own proxy_pass, because the
# trailing slash changes URI rewriting and the secret-path location needs its
# prefix stripped while the others must pass the URI through untouched.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;

# Studio streams run events over SSE; buffering would freeze the graph view
# until a run finished.
proxy_set_header Connection "";
proxy_buffering  off;
proxy_cache      off;
chunked_transfer_encoding off;

proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
