# Basic auth for the Studio endpoint. Included from inside limit_except, so it
# never applies to OPTIONS.
#
# If the hosted Studio UI cannot authenticate (symptom: empty graph list, a 401
# on /assistants/search in DevTools), replace both lines below with:
#     auth_basic off;
# The secret path prefix keeps guarding the endpoint on its own.
auth_basic           "LangGraph Studio";
auth_basic_user_file /etc/nginx/langgraph.htpasswd;
