# Fronts the LangGraph dev server for https://smith.langchain.com/studio.
#
# Studio is served over HTTPS and cannot call a plain http:// origin, and
# langgraph dev runs with auth "noop" -- so it binds 127.0.0.1:2025 and is
# reachable only through this proxy.

server {
    listen 2024 ssl;
    listen [::]:2024 ssl;
    # HTTP/2 disabled: nginx returned 400 to every CORS preflight over h2 while
    # the identical request succeeded over HTTP/1.1, which broke Studio.

    server_name langchain.axonbi.com;

    ssl_certificate     /etc/ssl/langgraph/fullchain.pem;
    ssl_certificate_key /etc/ssl/langgraph/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    client_max_body_size 32m;

    # Studio runs its reachability check BEFORE applying custom headers, so
    # these two must answer unauthenticated or Connect never enables. Both are
    # non-sensitive: /info is version and feature flags, /ok is health. Neither
    # lists graphs, reads state, nor starts a run.
    location = /info {
        proxy_pass http://127.0.0.1:2025;
        include /etc/nginx/langgraph-proxy.conf;
    }
    location = /ok {
        proxy_pass http://127.0.0.1:2025;
        include /etc/nginx/langgraph-proxy.conf;
    }

    # Everything that actually exposes or runs a graph stays behind the password.
    location / {
        # CORS preflight is sent WITHOUT credentials by every browser, so a 401
        # here would fail the check before the real request was ever made.
        limit_except OPTIONS {
            include /etc/nginx/langgraph-auth.conf;
        }
        proxy_pass http://127.0.0.1:2025;
        include /etc/nginx/langgraph-proxy.conf;
    }

    # Retained so the older base URL keeps working.
    location /SECRET_PATH/ {
        limit_except OPTIONS {
            include /etc/nginx/langgraph-auth.conf;
        }
        proxy_pass http://127.0.0.1:2025/;
        include /etc/nginx/langgraph-proxy.conf;
    }
}
